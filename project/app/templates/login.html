<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Elite Authentication</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Premium Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* Is pure section ko central wrapper me lock kar diya */
        .auth-wrapper {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            width: 100%;
        }

        /* Glassmorphism Card Wrapper Box - Fixed standard width */
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px; /* Card ki width ko lock kar diya taaki faile na */
            margin: 0 auto;  /* Hamesha horizontally screen ke beech me rahega */
        }

        /* Input Icon Wrapper Container */
        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 10;
        }

        /* Input Fields Aesthetic Overriding */
        .form-control {
            background-color: rgba(30, 41, 59, 0.5) !important;
            border: 1px solid rgba(100, 116, 139, 0.3) !important;
            color: #f1f5f9 !important;
            padding: 12px 16px 12px 46px !important;
            font-size: 14.5px;
            border-radius: 10px !important;
            transition: all 0.3s ease !important;
            width: 100%;
        }

        .form-control::placeholder {
            color: #475569 !important;
        }

        .form-control:focus {
            border-color: #c084fc !important;
            background-color: rgba(15, 23, 42, 0.9) !important;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.25) !important;
        }

        .form-control:focus ~ .input-icon {
            color: #c084fc;
        }

        /* Checkbox Styling */
        .form-check-input {
            background-color: rgba(30, 41, 59, 0.5) !important;
            border: 1px solid rgba(168, 85, 247, 0.4) !important;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #a855f7 !important;
            border-color: #a855f7 !important;
        }

        /* Submit Button with Gradient Accent */
        .submit-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 13px;
            border-radius: 10px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.25);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #b55fe6 0%, #4f46e5 100%);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
        }

        .text-purple-link {
            color: #a855f7;
            text-decoration: none;
            font-weight: 500;
        }
        .text-purple-link:hover {
            color: #c084fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- STEP 1: Main Absolute Wrapper (Divs minimal kar diye) -->
    <div class="auth-wrapper">
        
        <!-- STEP 2: The Core Locked Width Login Card -->
        <div class="login-card">
            
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); border-radius: 14px;">
                    <i class="bi bi-shield-lock-fill text-white fs-4"></i>
                </div>
                <h2 class="fw-bold mb-1" style="font-size: 26px; color: #ffffff;">Welcome Back</h2>
                <p style="color: #94a3b8; font-size: 14px;">Please enter your credentials to log in.</p>
            </div>




                   <!-- Error Message Display Context -->
{% if error %}
    <div class="alert error-alert" style="color: #ff3333; background: #ffe6e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
        {{ error }}
    </div>
{% endif %}

<!-- Success Message Display Context -->
{% if success %}
    <div class="alert success-alert" style="color: #00aa00; background: #e6ffe6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
        {{ success }}
    </div>
{% endif %}
            <!-- Form -->
            <form method="POST" action="" autocomplete="off">
                {% csrf_token %}
                
                <!-- Username Field -->
                <div class="mb-3">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Username or Email</label>
                    <div class="input-group-custom">
                        <input type="text" class="form-control" name="login_input" placeholder="username or email" required>
                        <i class="bi bi-person input-icon"></i>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Password</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                    <div class="form-check m-0">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me">
                        <label class="form-check-label small ms-1 text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="{% url 'forgot' %}" class="text-purple-link small">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    Sign In
                </button>

                <!-- Navigation Footer -->
                <div class="text-center mt-4" style="color: #94a3b8; font-size: 14px;">
                    Don't have an account? 
                    <a href="{% url 'signup' %}" class="text-purple-link ms-1 fw-semibold">Sign up</a>
                </div>

            </form>
        </div> <!-- /login-card -->

    </div> <!-- /auth-wrapper -->

    <!-- Bootstrap 5 JavaScript Bundle Component -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
